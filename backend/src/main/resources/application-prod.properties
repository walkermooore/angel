# O perfil prod falha no início se as credenciais não forem fornecidas pelo ambiente.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

app.security.jwt-secret=${JWT_SECRET}
app.security.secure-cookies=true
app.security.require-https=true
app.security.bootstrap-admin-enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
spring.jpa.show-sql=false
logging.structured.format.console=${LOG_FORMAT:ecs}

# Use "verify-full" quando o provedor PostgreSQL oferecer certificado verificável.
spring.datasource.hikari.data-source-properties.sslmode=${DATABASE_SSL_MODE:require}
