spring.application.name=backend
server.port=8081

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5435/angeldb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA/Flyway schema management
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Security (required in deployment; use at least 32 random characters)
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-expiration=${JWT_EXPIRATION:PT8H}
app.security.initial-admin-email=${ADMIN_INITIAL_EMAIL:}
app.security.initial-admin-password=${ADMIN_INITIAL_PASSWORD:}
app.security.initial-admin-name=${ADMIN_INITIAL_NAME:Administrador Angel}

# Comma-separated frontend origins, without trailing slash
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Max Payload & Multipart Upload Size (Allow Base64 image data)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.max-http-form-post-size=50MB
