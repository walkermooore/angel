spring.application.name=backend
server.port=8081

# Database Configuration (PostgreSQL)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5435/angeldb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# JPA/Flyway schema management
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Security (required in deployment; use at least 32 random characters)
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-expiration=${JWT_EXPIRATION:PT8H}
app.security.initial-admin-email=${ADMIN_INITIAL_EMAIL:}
app.security.initial-admin-password=${ADMIN_INITIAL_PASSWORD:}
app.security.initial-admin-name=${ADMIN_INITIAL_NAME:Administrador Angell}
app.security.bootstrap-admin-enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.security.secure-cookies=${SECURE_COOKIES:false}
app.security.require-https=${REQUIRE_HTTPS:false}

# Comma-separated frontend origins, without trailing slash
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Melhor Envio (use a URL de sandbox somente com um token criado no sandbox)
app.melhor-envio.base-url=${MELHOR_ENVIO_BASE_URL:https://melhorenvio.com.br}
app.melhor-envio.client-id=${MELHOR_ENVIO_CLIENT_ID:}
app.melhor-envio.client-secret=${MELHOR_ENVIO_CLIENT_SECRET:}
app.melhor-envio.redirect-uri=${MELHOR_ENVIO_REDIRECT_URI:http://localhost:8081/api/frete/oauth/callback}
app.melhor-envio.user-agent=${MELHOR_ENVIO_USER_AGENT:Portfolio Ecommerce (configure-um-contato)}
app.melhor-envio.origin-cep=${MELHOR_ENVIO_ORIGIN_CEP:78000000}

# InfinitePay Checkout Integrado. Permanece desligado até a InfiniteTag e URLs públicas serem configuradas.
app.infinitepay.enabled=${INFINITEPAY_ENABLED:false}
app.infinitepay.base-url=${INFINITEPAY_BASE_URL:https://api.checkout.infinitepay.io}
app.infinitepay.handle=${INFINITEPAY_HANDLE:}
app.infinitepay.redirect-base-url=${INFINITEPAY_REDIRECT_BASE_URL:http://localhost:5173}
app.infinitepay.webhook-url=${INFINITEPAY_WEBHOOK_URL:}

# Reservas de checkout: 30 minutos; verificação a cada minuto
app.inventory.reservation-minutes=${INVENTORY_RESERVATION_MINUTES:30}
app.inventory.expiration-check-ms=${INVENTORY_EXPIRATION_CHECK_MS:60000}
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

# Observabilidade. Mantenha Prometheus protegido na rede interna; somente health é público.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
logging.pattern.correlation=[%X{correlationId:-sem-correlacao}]

# Respostas públicas nunca expõem exceções, mensagens internas ou erros de binding.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.forward-headers-strategy=framework

# Rejeita campos que não fazem parte dos DTOs públicos (proteção contra mass assignment).
spring.jackson.deserialization.fail-on-unknown-properties=true

# Imagens são salvas como arquivos e persistidas no banco somente por URL.
app.media.directory=${MEDIA_DIRECTORY:./data/uploads}
app.media.public-base-url=${MEDIA_PUBLIC_BASE_URL:http://localhost:8081/api/media/images}
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:3MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:4MB}
server.max-http-form-post-size=${MAX_REQUEST_SIZE:4MB}
server.tomcat.max-swallow-size=${MAX_REQUEST_SIZE:4MB}

# Comunicações transacionais. SMTP e WhatsApp podem ser ativados independentemente.
app.notifications.public-url=${NOTIFICATIONS_PUBLIC_URL:http://localhost:5173}
app.notifications.email-enabled=${TRANSACTIONAL_EMAIL_ENABLED:false}
app.notifications.email-from=${TRANSACTIONAL_EMAIL_FROM:}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
management.health.mail.enabled=${TRANSACTIONAL_EMAIL_ENABLED:false}
app.notifications.whatsapp-enabled=${TRANSACTIONAL_WHATSAPP_ENABLED:false}
app.notifications.whatsapp-webhook-url=${WHATSAPP_WEBHOOK_URL:}
app.notifications.whatsapp-token=${WHATSAPP_API_TOKEN:}
app.notifications.dispatch-ms=${NOTIFICATION_DISPATCH_MS:30000}

# RabbitMQ desacopla o outbox dos provedores. Desativado por padrão para manter o modo local simples.
app.rabbitmq.enabled=${RABBITMQ_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.listener.simple.prefetch=${RABBITMQ_PREFETCH:10}
spring.rabbitmq.listener.simple.concurrency=${RABBITMQ_CONSUMERS:1}
spring.rabbitmq.listener.simple.max-concurrency=${RABBITMQ_MAX_CONSUMERS:4}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
management.health.rabbit.enabled=${RABBITMQ_ENABLED:false}
