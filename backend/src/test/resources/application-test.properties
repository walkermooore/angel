spring.datasource.url=jdbc:h2:mem:angeltest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

app.security.jwt-secret=test-secret-with-more-than-thirty-two-characters
app.security.jwt-expiration=PT1H
app.security.initial-admin-email=integration@angel.test
app.security.initial-admin-password=integration-password-123
app.security.initial-admin-name=Integration Admin
app.cors.allowed-origins=http://localhost:5173
