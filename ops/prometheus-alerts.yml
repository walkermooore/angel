groups:
  - name: angell
    rules:
      - alert: AngellBackendIndisponivel
        expr: up{job="angell-backend"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Backend Angell indisponível"
      - alert: AngellMuitosErros5xx
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 0.1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Taxa elevada de erros 5xx"
      - alert: AngellPedidosPresos
        expr: angell_orders_stuck_pending > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Há pedidos pendentes há mais de 24 horas"
      - alert: MelhorEnvioLento
        expr: histogram_quantile(0.95, sum by (le) (rate(angell_external_api_duration_seconds_bucket{provider="melhor_envio"}[10m]))) > 5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Melhor Envio com p95 acima de 5 segundos"
