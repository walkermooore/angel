name: CI e imagens

on:
  pull_request:
  push:
    branches: [main, leo]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testes e análise estática Java
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: TypeScript
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8081/api
          VITE_SITE_URL: https://example.invalid
        run: npm run build
      - name: Auditoria de dependências
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  images:
    if: github.event_name == 'push'
    needs: [backend, frontend, secrets]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}-${{ matrix.app }}:${{ github.ref_name }}

  release-ready:
    if: github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: |
          echo "Imagens imutáveis publicadas com tag $GITHUB_SHA."
          echo "O ambiente de produção deve promover essa tag, verificar /actuator/health e reverter para a tag anterior em falha."
